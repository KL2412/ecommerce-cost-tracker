name: ecommerce-cost-tracker

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "if [ ! -f .env ]; then cp .env.example .env; fi
      && composer install --no-interaction --prefer-dist
      && if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi
      && if ! grep -q '^JWT_SECRET=.' .env; then php artisan jwt:secret --force; fi
      && php artisan migrate --force
      && php artisan db:seed --force
      && chown -R www-data:www-data storage bootstrap/cache
      && chmod -R ug+rwX storage bootstrap/cache
      && exec php-fpm"
    volumes:
      - .:/var/www/html
      - vendor-data:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce_cost_tracker}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-ecommerce_cost_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  vendor-data:
